<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="AI Review Assistant architecture">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#f6f8fa"/>
  <text x="460" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#24292f">AI Review Assistant «Эхо»</text>
  <text x="460" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#57606a">Classify customer reviews, draft replies, build analytics</text>

  <text x="40" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">INPUT</text>
  <rect x="40" y="100" width="140" height="56" rx="8" fill="#24292f"/>
  <text x="110" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Reviews</text>
  <text x="110" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">7 channels · CSV</text>

  <line x1="180" y1="128" x2="215" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="220" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">PROMPT ASSEMBLY</text>
  <rect x="220" y="100" width="160" height="56" rx="8" fill="#0969da"/>
  <text x="300" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">System prompt</text>
  <text x="300" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ddf4ff">role · style · limits</text>

  <rect x="220" y="176" width="160" height="56" rx="8" fill="#8250df"/>
  <text x="300" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Knowledge base</text>
  <text x="300" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fbefff">7 CSV tables</text>
  <line x1="300" y1="176" x2="300" y2="162" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="380" y1="128" x2="415" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="420" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">MODEL</text>
  <rect x="420" y="100" width="150" height="56" rx="8" fill="#1a7f37"/>
  <text x="495" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">OpenAI</text>
  <text x="495" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#dafbe1">strict JSON schema</text>

  <line x1="570" y1="128" x2="605" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="610" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">GUARDRAILS</text>
  <rect x="610" y="100" width="170" height="56" rx="8" fill="#bc4c00"/>
  <text x="695" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Answer checks</text>
  <text x="695" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff1e5">length · stop-phrases · PII</text>

  <line x1="695" y1="156" x2="695" y2="190" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="610" y="212" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">OUTPUT</text>
  <rect x="610" y="220" width="170" height="56" rx="8" fill="#24292f"/>
  <text x="695" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Draft for operator</text>
  <text x="695" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">human publishes it</text>

  <text x="40" y="212" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">CLASSIFICATION</text>
  <rect x="40" y="220" width="140" height="56" rx="8" fill="#0969da"/>
  <text x="110" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Topic · sentiment</text>
  <text x="110" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ddf4ff">12 topics · P0–P3</text>

  <text x="40" y="312" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">ESCALATION</text>
  <rect x="40" y="320" width="140" height="56" rx="8" fill="#cf222e"/>
  <text x="110" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">P0 → manager</text>
  <text x="110" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffebe9">safety · legal · money</text>

  <rect x="220" y="320" width="160" height="56" rx="8" fill="#8250df"/>
  <text x="300" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Analytics</text>
  <text x="300" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fbefff">11-section report</text>

  <rect x="420" y="320" width="150" height="56" rx="8" fill="#1a7f37"/>
  <text x="495" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Evaluation</text>
  <text x="495" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#dafbe1">gold set · P0 recall 100%</text>

  <rect x="610" y="320" width="170" height="56" rx="8" fill="#0969da"/>
  <text x="695" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">CLI · Streamlit</text>
  <text x="695" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ddf4ff">single · batch · report</text>

  <text x="460" y="406" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#57606a">The assistant never publishes or deletes anything — it prepares a draft, a human decides.</text>
</svg>

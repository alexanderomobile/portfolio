<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" role="img" aria-label="AI development platform architecture">
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/></marker></defs>
  <rect width="960" height="534" fill="#f6f8fa"/>
  <text x="480" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#24292f">AI Development Platform</text>
  <text x="480" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#57606a">Autonomous development on top of Claude Code · one LXC per project · cloud with local fallback</text>
  <rect x="24" y="74" width="912" height="136" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="38" y="93" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">OWNER · asynchronous</text>
  <rect x="40" y="104" width="269" height="92" rx="8" fill="#24292f"/>
  <text x="175" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Web panel</text>
  <text x="175" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">requests and agent steps</text>
  <text x="175" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">limits and token spend</text>
  <rect x="345" y="104" width="269" height="92" rx="8" fill="#24292f"/>
  <text x="480" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Owner notes</text>
  <text x="480" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">tasks for the next cycles</text>
  <text x="480" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">87 of 87 resolved</text>
  <rect x="651" y="104" width="269" height="92" rx="8" fill="#24292f"/>
  <text x="785" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Agent questions</text>
  <text x="785" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">blocker · access · decision</text>
  <text x="785" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">work goes on meanwhile</text>
  <rect x="24" y="224" width="912" height="136" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="38" y="243" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">ENGINE · FastAPI + daemon + SQLite</text>
  <rect x="40" y="254" width="193" height="92" rx="8" fill="#0969da"/>
  <text x="136" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Autostart daemon</text>
  <text x="136" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">5-hour limit windows</text>
  <text x="136" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">warm prompt cache</text>
  <line x1="235" y1="300" x2="267" y2="300" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="269" y="254" width="193" height="92" rx="8" fill="#0969da"/>
  <text x="366" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Cycle</text>
  <text x="366" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">read plan and journal</text>
  <text x="366" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">code · tests · report</text>
  <line x1="464" y1="300" x2="496" y2="300" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="498" y="254" width="193" height="92" rx="8" fill="#1f883d"/>
  <text x="594" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Honest acceptance</text>
  <text x="594" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d2f0dc">mandatory «not verified»</text>
  <text x="594" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d2f0dc">no formal brush-offs</text>
  <line x1="693" y1="300" x2="725" y2="300" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="727" y="254" width="193" height="92" rx="8" fill="#57606a"/>
  <text x="824" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Circuit breaker</text>
  <text x="824" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e6e9ec">pause after any failure</text>
  <text x="824" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e6e9ec">off after 3 in a row</text>
  <rect x="24" y="374" width="912" height="136" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="38" y="393" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">EXECUTION · isolated per project</text>
  <rect x="40" y="404" width="193" height="92" rx="8" fill="#0969da"/>
  <text x="136" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">SSH runner</text>
  <text x="136" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">Claude Agent SDK</text>
  <text x="136" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">JSON event stream</text>
  <line x1="235" y1="450" x2="267" y2="450" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="269" y="404" width="193" height="92" rx="8" fill="#1f883d"/>
  <text x="366" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Project LXC</text>
  <text x="366" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d2f0dc">agent sees only its project</text>
  <text x="366" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d2f0dc">sudo: restart own service</text>
  <line x1="464" y1="450" x2="496" y2="450" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="498" y="404" width="193" height="92" rx="8" fill="#0969da"/>
  <text x="594" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Model</text>
  <text x="594" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">Claude in the cloud</text>
  <text x="594" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfe3fb">fallback: Qwen3.8-27B local</text>
  <line x1="693" y1="450" x2="725" y2="450" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="727" y="404" width="193" height="92" rx="8" fill="#57606a"/>
  <text x="824" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">GPU arbiter</text>
  <text x="824" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e6e9ec">shared with voice assistant</text>
  <text x="824" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e6e9ec">take · give · status only</text>
</svg>

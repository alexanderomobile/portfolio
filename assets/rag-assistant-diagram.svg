  <text x="95" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Console</text>
  <text x="95" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">user question</text>
  <line x1="150" y1="222" x2="185" y2="222" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="196" width="120" height="52" rx="8" fill="#1a7f37"/>

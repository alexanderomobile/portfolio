  <text x="250" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#dafbe1">semantic search</text>
  <line x1="310" y1="222" x2="345" y2="222" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="196" width="120" height="52" rx="8" fill="#8250df"/>
  <text x="410" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">ChromaDB</text>
  <text x="410" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fbefff">top chunks</text>
  <line x1="470" y1="222" x2="505" y2="222" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="196" width="130" height="52" rx="8" fill="#bf8700"/>
  <text x="575" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">GPT-4o-mini</text>
  <text x="575" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff8c5">grounded answer</text>
  <line x1="640" y1="222" x2="675" y2="222" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680" y="196" width="110" height="52" rx="8" fill="#0969da"/>
  <text x="735" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Answer</text>
  <text x="735" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ddf4ff">with sources</text>

  <rect x="190" y="280" width="150" height="52" rx="8" fill="#656d76"/>
  <text x="265" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">SQLite cache</text>
  <text x="265" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#f6f8fa">repeat queries</text>
  <line x1="575" y1="248" x2="575" y2="268" stroke="#57606a" stroke-width="2"/>
  <line x1="575" y1="268" x2="265" y2="268" stroke="#57606a" stroke-width="2"/>
  <line x1="265" y1="268" x2="265" y2="280" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="510" y="280" width="150" height="52" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="585" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#24292f">RAGAS metrics</text>
  <text x="585" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#57606a">quality evaluation</text>

  <text x="460" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#57606a">Python | OpenAI | ChromaDB | SQLite | RAGAS</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="RAG Documentation Assistant architecture">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#f6f8fa"/>
  <text x="460" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#24292f">RAG Documentation Assistant</text>
  <text x="460" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#57606a">Console Q&amp;A over technical documentation</text>

  <text x="60" y="88" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">INDEXING</text>
  <rect x="40" y="96" width="130" height="52" rx="8" fill="#0969da"/>
  <text x="105" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Docs ingest</text>
  <text x="105" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ddf4ff">chunk + embed</text>
  <line x1="170" y1="122" x2="205" y2="122" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="96" width="130" height="52" rx="8" fill="#8250df"/>
  <text x="275" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">ChromaDB</text>
  <text x="275" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fbefff">vector store</text>


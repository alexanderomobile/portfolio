<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="Brand Voice LoRA pipeline">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#f6f8fa"/>
  <text x="460" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#24292f">Brand Voice LoRA</text>
  <text x="460" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#57606a">An open model learns the brand's tone of voice · facts still come from the knowledge base · runs locally</text>

  <text x="25" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">STYLE</text>
  <rect x="25" y="100" width="190" height="56" rx="8" fill="#24292f"/>
  <text x="120" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Style guide · fact sheet</text>
  <text x="120" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">11 rules · 9 checked by a linter</text>

  <line x1="215" y1="128" x2="240" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="245" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">DATASET</text>
  <rect x="245" y="100" width="190" height="56" rx="8" fill="#bc4c00"/>
  <text x="340" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">9 writer + 9 reviewer agents</text>
  <text x="340" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff1e5">510 pairs · 254 fixed · 106 test paraphrases removed</text>

  <line x1="435" y1="128" x2="460" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="465" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">TRAINING</text>
  <rect x="465" y="100" width="190" height="56" rx="8" fill="#8250df"/>
  <text x="560" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">LoRA r=16 · Qwen3-4B-Instruct</text>
  <text x="560" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fbefff">403 pairs · 1.9 min · RTX 5070 Ti</text>

  <line x1="655" y1="128" x2="680" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="685" y="92" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">EVALUATION</text>
  <rect x="685" y="100" width="210" height="56" rx="8" fill="#0969da"/>
  <text x="790" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">60 held-out questions</text>
  <text x="790" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ddf4ff">linter · fact check · 3 blind judges</text>

  <line x1="790" y1="156" x2="790" y2="196" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="25" y="190" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">IN PRODUCTION</text>
  <rect x="25" y="198" width="270" height="64" rx="8" fill="#1a7f37"/>
  <text x="160" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Fine-tuned model + short fact sheet</text>
  <text x="160" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#dafbe1">style from weights · facts from RAG context</text>
  <text x="160" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#dafbe1">prompt 683 tokens instead of 1363</text>

  <line x1="295" y1="230" x2="320" y2="230" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="325" y="190" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">DEPLOY</text>
  <rect x="325" y="198" width="270" height="64" rx="8" fill="#24292f"/>
  <text x="460" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">merge → GGUF Q4_K_M → Ollama</text>
  <text x="460" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">2.5 GB instead of 8 GB · ~190 tokens/s</text>
  <text x="460" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#d0d7de">local API · client messages stay in-house</text>

  <text x="625" y="190" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">RESULT (60 QUESTIONS)</text>
  <rect x="625" y="198" width="270" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="760" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#24292f">In brand style: 52 vs 0 (35 w/o typography)</text>
  <text x="760" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#57606a">fine-tune + facts vs long style prompt</text>
  <text x="760" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#57606a">judges overall 36 : 23 · invented 21 vs 33</text>

  <text x="25" y="300" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#57606a">WHAT THE LOGS OF THE COURSE CODE SHOWED</text>
  <rect x="25" y="308" width="870" height="76" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="45" y="332" font-family="Arial,sans-serif" font-size="11" fill="#24292f">· warmup of 100 steps was longer than the whole run (18 steps): the learning rate never reached its target, loss stayed near 6</text>
  <text x="45" y="350" font-family="Arial,sans-serif" font-size="11" fill="#24292f">· training and chat used different prompt templates; EOS was masked, so the model did not learn to stop</text>
  <text x="45" y="368" font-family="Arial,sans-serif" font-size="11" fill="#24292f">· ruGPT-3 small is too weak for a brand voice (0–1 of 60 in style even with fixes) → Qwen3-4B-Instruct-2507, Apache 2.0</text>

  <text x="460" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#57606a">Test data, 7 Nov 2026 · LLM-written held-out questions · no live clients yet · facts still need RAG: even with them judges flag 21 of 60</text>
</svg>
